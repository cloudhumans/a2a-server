[project]
name = "a2a-server"
version = "0.1.0"
description = "A2A server built with LangGraph: sync, async with push notifications, fixed-token auth and a live traffic dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server]==1.3.0",
    "httpx>=0.28.1",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]
