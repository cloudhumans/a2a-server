services:
  agent:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 8000
    ports:
      - "127.0.0.1:${AGENT_PORT:-8000}:8000"

  inspector:
    build: https://github.com/a2aproject/a2a-inspector.git#v0.2.0
    image: a2a-inspector:v0.2.0
    depends_on:
      agent:
        condition: service_healthy
    command:
      - --agent-card=http://agent:8000
      - --webhook-url=http://inspector:8080
      - --auth=${INSPECTOR_AUTH:-}
    ports:
      - "127.0.0.1:${INSPECTOR_PORT:-8080}:8080"
